# API Worker entry point, custom domain and storage bindings. See README.md for setup.
# The Worker keeps its original Cloudflare name so its secrets and bindings carry over.
name = "snapmap-plus-community"
main = "worker.js"
compatibility_date = "2026-07-01"
routes = [{ pattern = "api.snapmapplus.com", custom_domain = true }]
# Workers plan. The store runs on Workers Free and on Workers Paid from the same code: the Worker
# only moves bytes, and the work that reads every byte runs in Durable Objects, which have 30 s of
# CPU a request on either plan. After subscribing to Workers Paid, uncomment these two lines and
# deploy: they give each request (Worker or Durable Object) up to 5 minutes of CPU. Nothing else
# changes.
# [limits]
# cpu_ms = 300000

# Session store (opaque session id -> GitHub user token, server-side only)
[[kv_namespaces]]
binding = "SESSIONS"
id = "4fce15ae690b4c5e8a66555bd4a2171f"

# Screenshot uploads (served back through GET /media/:key)
[[r2_buckets]]
bucket_name = "snapmap-plus-media"
binding = "MEDIA"

[[durable_objects.bindings]]
name = "WRITE_QUOTAS"
class_name = "CommunityQuota"

[[migrations]]
tag = "v1-write-quotas"
new_sqlite_classes = ["CommunityQuota"]

# The mod store (README.md, "Mod store"): units of published maps, their files once each in packs, served through /mods/*.
# Provisioned by the maintainer (npx wrangler r2 bucket create snapmap-plus-mods).
[[r2_buckets]]
bucket_name = "snapmap-plus-mods"
binding = "MODS"

# Retain the original bundle registry and its records.
[[durable_objects.bindings]]
name = "MOD_REGISTRY"
class_name = "ModRegistry"

[[migrations]]
tag = "v2-mod-registry"
new_sqlite_classes = ["ModRegistry"]

# The check of each unit's uploads, one object per unit hash (mods_registry.js ModChecker): it
# reads an upload back and hashes every byte, which needs a Durable Object's CPU time.
[[durable_objects.bindings]]
name = "MOD_CHECKER"
class_name = "ModChecker"

[[migrations]]
tag = "v3-mod-checker"
new_sqlite_classes = ["ModChecker"]

# New namespace for unit files, map claims and publishing keys.
[[durable_objects.bindings]]
name = "UNIT_REGISTRY"
class_name = "UnitRegistry"

[[migrations]]
tag = "v4-unit-registry"
new_sqlite_classes = ["UnitRegistry"]

# Historical bundle takedowns. Unit moderation is recorded in UnitRegistry.
[vars]
MODS_BLOCKED = "[]"

# Daily purge of units no claim has named for 24 hours, of uploads in parts abandoned
# for a day and of objects no row names (scheduled handler in worker.js).
[triggers]
crons = ["23 4 * * *"]
