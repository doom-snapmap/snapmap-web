# API Worker entry point, custom domain and storage bindings. See README.md for setup.
# The Worker keeps its original Cloudflare name so its secrets and bindings carry over.
name = "snapmap-plus-community"
main = "worker.js"
compatibility_date = "2026-07-01"
routes = [{ pattern = "api.snapmapplus.com", custom_domain = true }]

# Session store (opaque session id -> GitHub user token, server-side only)
[[kv_namespaces]]
binding = "SESSIONS"
id = "4fce15ae690b4c5e8a66555bd4a2171f"

# Screenshot uploads (served back through GET /media/:key)
[[r2_buckets]]
bucket_name = "snapmap-plus-media"
binding = "MEDIA"

[[durable_objects.bindings]]
name = "WRITE_QUOTAS"
class_name = "CommunityQuota"

[[migrations]]
tag = "v1-write-quotas"
new_sqlite_classes = ["CommunityQuota"]
