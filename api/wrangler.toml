# API Worker entry point, custom domain and storage bindings. See README.md for setup.
# The Worker keeps its original Cloudflare name so its secrets and bindings carry over.
name = "snapmap-plus-community"
main = "worker.js"
compatibility_date = "2026-07-01"
routes = [{ pattern = "api.snapmapplus.com", custom_domain = true }]

# Session store (opaque session id -> GitHub user token, server-side only)
[[kv_namespaces]]
binding = "SESSIONS"
id = "4fce15ae690b4c5e8a66555bd4a2171f"

# Screenshot uploads (served back through GET /media/:key)
[[r2_buckets]]
bucket_name = "snapmap-plus-media"
binding = "MEDIA"

[[durable_objects.bindings]]
name = "WRITE_QUOTAS"
class_name = "CommunityQuota"

[[migrations]]
tag = "v1-write-quotas"
new_sqlite_classes = ["CommunityQuota"]

# Anonymous mod store: one archive per build, each its own object build/<hash>/<id>, served through /mods/*.
# Provisioned by the maintainer (npx wrangler r2 bucket create snapmap-plus-mods).
[[r2_buckets]]
bucket_name = "snapmap-plus-mods"
binding = "MODS"

# Single index of stored builds, their anonymous claims and the uploads in parts in progress.
[[durable_objects.bindings]]
name = "MOD_REGISTRY"
class_name = "ModRegistry"

[[migrations]]
tag = "v2-mod-registry"
new_sqlite_classes = ["ModRegistry"]
# The check of each build's uploads, one object per build hash (mods_registry.js ModChecker): it
# reads an upload back and hashes every byte, which needs a Durable Object's CPU time.
[[durable_objects.bindings]]
name = "MOD_CHECKER"
class_name = "ModChecker"

[[migrations]]
tag = "v3-mod-checker"
new_sqlite_classes = ["ModChecker"]

# Takedown list: JSON array of blocked build hashes; edit and redeploy to block.
[vars]
MODS_BLOCKED = "[]"

# Daily purge of builds nothing ever claimed, older than one hour, and of uploads in parts abandoned
# for a day (scheduled handler in worker.js); a released build is deleted at its release, not here.
[triggers]
crons = ["23 4 * * *"]
