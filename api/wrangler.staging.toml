# A staging copy of the API Worker for clean mod-store testing: its own name, buckets, session store
# and index, on workers.dev, never the custom domain, so nothing a player uses is touched.
#   npx wrangler deploy -c wrangler.staging.toml
# Empty it between runs with the reset route (README.md, "MODS_ADMIN_TOKEN") or by deleting the
# objects of snapmap-plus-mods-staging.
name = "snapmap-plus-community-staging"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = true
# Workers plan. The store runs on Workers Free and on Workers Paid from the same code: the Worker
# only moves bytes, and the work that reads every byte runs in Durable Objects, which have 30 s of
# CPU a request on either plan. After subscribing to Workers Paid, uncomment these two lines and
# deploy: they give each request (Worker or Durable Object) up to 5 minutes of CPU. Nothing else
# changes. docs/services.md, "Switching to Workers Paid", says how to check it.
# [limits]
# cpu_ms = 300000

[[kv_namespaces]]
binding = "SESSIONS"
id = "16b82daba3214db2912e3a498c401d93"

[[r2_buckets]]
bucket_name = "snapmap-plus-media-staging"
binding = "MEDIA"

[[durable_objects.bindings]]
name = "WRITE_QUOTAS"
class_name = "CommunityQuota"

[[migrations]]
tag = "v1-write-quotas"
new_sqlite_classes = ["CommunityQuota"]

[[r2_buckets]]
bucket_name = "snapmap-plus-mods-staging"
binding = "MODS"

[[durable_objects.bindings]]
name = "MOD_REGISTRY"
class_name = "ModRegistry"

[[migrations]]
tag = "v2-mod-registry"
new_sqlite_classes = ["ModRegistry"]
# The check of each unit's uploads, one object per unit hash (mods_registry.js ModChecker): it
# reads an upload back and hashes every byte, which needs a Durable Object's CPU time.
[[durable_objects.bindings]]
name = "MOD_CHECKER"
class_name = "ModChecker"

[[migrations]]
tag = "v3-mod-checker"
new_sqlite_classes = ["ModChecker"]

# Staging only: an unclaimed unit is kept 60 seconds, not D40's 24 hours, so an unpublish and the
# purge that follows (POST /mods/admin/purge) can be shown in one sitting. Production's wrangler.toml
# never sets it. A publish slower than this between its begin and its claim can lose its unit to a
# purge run meanwhile; run the purge only after the claim.
[vars]
MODS_DELETE_DELAY_MS = "60000"

[triggers]
crons = ["23 4 * * *"]
